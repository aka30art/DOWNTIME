name: DOWNTIME CI
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
# Settings QA is exercised in Playwright: desktop/tablet/mobile card grid, shared area presets, and central add/remove persistence.
      - run: npm run test:smoke
      - name: Upload Stage 4 expanded weekly analytics screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-4-weekly-analytics-expanded-qa
          path: artifacts/stage-4/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Stage 3 expanded Day Setup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-day-setup-expanded-qa
          path: artifacts/stage-3/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Stage 1 viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-mobile-containment-qa
          path: artifacts/stage-1/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Daily Stats and mobile dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dashboard-daily-stats-qa
          path: artifacts/mobile-dashboard/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload WEEKLY Reports preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-preview-qa
          path: artifacts/weekly-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Settings hub desktop and area preset QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-hub-layout-qa
          path: artifacts/settings-hub/
          if-no-files-found: warn
          retention-days: 7

  central-edge-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check the central Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/central-bank/index.ts
      - name: Type-check the isolated CDB configuration function
        run: deno check --node-modules-dir=auto supabase/functions/central-config-admin/index.ts
      - name: Type-check the R&M Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/repair-maintenance-api/index.ts
      - name: Type-check the YARD HUB Settings Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/yard-hub-settings-api/index.ts
