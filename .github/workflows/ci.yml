name: DOWNTIME CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2\n        with:\n          deno-version: v2.x\n      - run: npm install --no-audit --no-fund\n      - run: deno check supabase/functions/username-auth/index.ts supabase/functions/central-users/index.ts supabase/functions/central-sync/index.ts
      - run: npx playwright install chromium
      - run: npm run test:smoke
