name: DOWNTIME CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run test:smoke
      - name: Upload Stage 3 expanded Day Setup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-day-setup-expanded-qa
          path: artifacts/stage-3/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Stage 1 viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-mobile-containment-qa
          path: artifacts/stage-1/
          if-no-files-found: warn
          retention-days: 7

  central-edge-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check the central Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/central-bank/index.ts
