          curl --fail --silent --show-error --location "$LIVE_URL/central-bank-admin.html" -o /tmp/live-central-bank-admin.html
          grep -q 'CENTRAL DATA BANK ADMIN' /tmp/live-central-bank-admin.html
          grep -q 'https://ygwfipksbbprqynvbklk.supabase.co' /tmp/live-central-bank-admin.html
          ! grep -q 'https://phfojlqezudbjslfrnyw.supabase.co' /tmp/live-central-bank-admin.html
