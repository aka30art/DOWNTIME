name: Deploy Plant Downtime Tracker

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-verified-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser smoke tests
        run: npm run test:smoke

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$LIVE_URL" -o /tmp/live-site.html
          grep -q 'operatorChoices' /tmp/live-site.html
          grep -q 'unlockStartBtn' /tmp/live-site.html
          grep -q 'spectator-read' /tmp/live-site.html
          grep -q 'manualRefreshBtn' /tmp/live-site.html
          grep -q 'spectatorManualRefresh' /tmp/live-site.html
          echo "Live Pages smoke checks passed: standard-role and Spectator manual refresh controls, operator gate, and secure Spectator endpoint."
