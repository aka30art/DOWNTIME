name: Deploy Plant Downtime Tracker

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-verified-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser smoke tests
        run: npm run test:smoke
      - name: Upload WEEKLY Reports preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-preview-qa
          path: artifacts/weekly-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Settings hub desktop and area preset QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-hub-layout-qa
          path: artifacts/settings-hub/
          if-no-files-found: warn
          retention-days: 7

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$LIVE_URL" -o /tmp/live-site.html
          grep -q 'centralUsername' /tmp/live-site.html
          grep -q 'central-bank-client.js' /tmp/live-site.html
          grep -q 'DOWNTIME_CENTRAL_API' /tmp/live-site.html
          grep -q 'DowntimeCentral.login(username,pin)' /tmp/live-site.html
          grep -q 'DowntimeCentral.saveTracker(snapshot,centralVersion)' /tmp/live-site.html
          grep -q 'manualRefreshBtn' /tmp/live-site.html
          grep -q 'centralAdminNav' /tmp/live-site.html
          grep -q 'overview-link' /tmp/live-site.html
          grep -q 'plant-overview-preview.html' /tmp/live-site.html
          grep -q 'id="settingsHub"' /tmp/live-site.html
          grep -q 'data-settings-open="users"' /tmp/live-site.html
          grep -q 'data-settings-open="areas"' /tmp/live-site.html
          grep -q 'data-settings-open="reasons"' /tmp/live-site.html
          grep -q 'data-settings-open="schedule"' /tmp/live-site.html
          grep -q 'id="settingsPanelUsers"' /tmp/live-site.html
          grep -q 'id="settingsPanelAreas"' /tmp/live-site.html
          grep -q 'id="settingsPanelReasons"' /tmp/live-site.html
          grep -q 'id="settingsPanelSchedule"' /tmp/live-site.html
          echo "Live Pages smoke checks passed: central USER authentication, central versioned sync, role admin entry point, and Plant Overview."
