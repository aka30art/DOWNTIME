name: Deploy Plant Downtime Tracker

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-verified-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser smoke tests
        run: npm run test:smoke
      - name: Upload WEEKLY Reports preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-preview-qa
          path: artifacts/weekly-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Settings hub desktop and area preset QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-hub-layout-qa
          path: artifacts/settings-hub/
          if-no-files-found: warn
          retention-days: 7

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$LIVE_URL" -o /tmp/live-site.html
          grep -q 'centralUsername' /tmp/live-site.html
          grep -q 'id="yardHub"' /tmp/live-site.html
          ! grep -q 'yard-tile-index' /tmp/live-site.html
          grep -q 'id="yardHubSettingsBtn"' /tmp/live-site.html
          grep -q 'id="yardHubSettingsUsers"' /tmp/live-site.html
          grep -q 'id="yardHubSettingsStaff"' /tmp/live-site.html
          grep -q 'ACCESS AND RIGHTS' /tmp/live-site.html
          grep -q 'id="yardHubIdentityReset"' /tmp/live-site.html
          grep -q 'id="yardHubSettingsTiers"' /tmp/live-site.html
          grep -q 'yard-hub-settings.js' /tmp/live-site.html
          grep -q 'yard-hub-settings.css' /tmp/live-site.html
          grep -q 'id="launchGatelogBtn"' /tmp/live-site.html
          grep -q 'gatelog-app.js' /tmp/live-site.html
          grep -q 'gatelog-app.css' /tmp/live-site.html
          curl --fail --silent --show-error --location "$LIVE_URL/yard-hub-settings.js?v=20261127-2" -o /tmp/live-yard-hub-settings.js
          grep -q 'my-access' /tmp/live-yard-hub-settings.js
          grep -q 'MECHANIC' /tmp/live-yard-hub-settings.js
          grep -q 'yard-hub-structure.js' /tmp/live-site.html
          grep -q 'yard-hub-structure.css' /tmp/live-site.html
          curl --fail --silent --show-error --location "$LIVE_URL/yard-hub-structure.js?v=phase09-1" -o /tmp/live-yard-hub-structure.js
          grep -q "action:'yard-hub-menu'" /tmp/live-yard-hub-structure.js
          grep -q 'makeCustomTile' /tmp/live-yard-hub-structure.js
          curl --fail --silent --show-error --location "$LIVE_URL/yard-hub-structure.css?v=phase09-1" -o /tmp/live-yard-hub-structure.css
          grep -q '.yard-structure-link' /tmp/live-yard-hub-structure.css
          curl --fail --silent --show-error --location "$LIVE_URL/repair-maintenance.html" -o /tmp/live-repair-maintenance.html
          grep -q 'AREA / PART OF MACHINERY' /tmp/live-repair-maintenance.html
          grep -q 'id="openRmsSettingsShortcut"' /tmp/live-repair-maintenance.html
